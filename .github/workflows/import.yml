# Import a large file into `main` from a URL, downloading on GitHub's side so
# nothing big has to be pushed from a laptop. Handles direct links and
# WeTransfer links (resolved through their public API). Trigger:
#
#   gh workflow run import.yml -R alihassan-pixel/portal_xml \
#     -f url="https://..." -f path="portalapp.dmg"
name: Import file into main

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Download URL (direct link or WeTransfer link)"
        required: true
      path:
        description: "Destination path in the repo (e.g. portalapp.dmg)"
        required: true

permissions:
  contents: write

concurrency:
  group: import-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          case "$URL" in
            *wetransfer.com*|*we.tl*)
              # Resolve the share page to a signed direct link (valid ~10 min),
              # then fetch it like any other URL.
              UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
              final=$(curl -sIL -A "$UA" -o /dev/null -w '%{url_effective}' "$URL")
              tid=$(printf '%s' "$final" | sed -nE 's#.*/downloads/([0-9a-f]+)/([0-9a-f]+).*#\1#p')
              hash=$(printf '%s' "$final" | sed -nE 's#.*/downloads/([0-9a-f]+)/([0-9a-f]+).*#\2#p')
              [ -n "$tid" ] && [ -n "$hash" ] || { echo "could not parse transfer id from $final"; exit 1; }
              direct=$(curl -sf -A "$UA" -X POST "https://wetransfer.com/api/v4/transfers/$tid/download" \
                -H "Content-Type: application/json" \
                -d "{\"security_hash\":\"$hash\",\"intent\":\"entire_transfer\"}" | jq -r '.direct_link // empty')
              [ -n "$direct" ] || { echo "WeTransfer API returned no direct_link"; exit 1; }
              name=$(printf '%s' "$direct" | sed -E 's#\?.*##; s#.*/##')
              curl -fL --retry 5 --retry-all-errors -A "$UA" -o "$name" "$direct"
              ;;
            *)
              curl -fL --retry 5 --retry-all-errors -o "$(basename "$DEST")" "$URL"
              ;;
          esac
          # WeTransfer delivers multi-file transfers as a zip: unpack it,
          # unless the destination itself is a zip.
          if ls *.zip >/dev/null 2>&1 && [[ "$DEST" != *.zip ]]; then
            unzip -oq ./*.zip && rm -f ./*.zip
          fi
          # Exactly one file must remain; that's what gets committed as $DEST.
          f=$(find . -type f | head -n 1)
          n=$(find . -type f | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "expected exactly one downloaded file, got $n:"; find . -type f; exit 1
          fi
          mkdir -p "$(dirname "../$DEST")"
          mv "$f" "../$DEST"
          cd .. && rm -rf dl
          ls -la "$DEST"

      - name: Commit and push
        env:
          DEST: ${{ inputs.path }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST"
          if git diff --cached --quiet; then
            echo "$DEST unchanged; nothing to commit"; exit 0
          fi
          git commit -m "Import $DEST"
          git push origin HEAD:main
